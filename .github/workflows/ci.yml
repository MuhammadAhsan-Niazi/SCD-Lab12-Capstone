# Continuous Integration pipeline (Lab 9).
# Stage order is deliberate: cheapest failure first (install), then compile, then the slow test run.
name: Java CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 3. Install dependencies
        run: mvn -B dependency:go-offline

      - name: 4. Build (compile main and test sources)
        run: mvn -B -DskipTests test-compile

      - name: 5. Run unit tests
        run: mvn -B test

      - name: 6. Package artifact
        run: mvn -B -DskipTests package

      - name: 7. Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab09-jar
          path: target/*.jar
